<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Risk Capital Calculator</title>

<style>
body {
  margin: 0;
  background: #0e1117;
  color: #e6edf3;
  font-family: system-ui, sans-serif;
  padding: 16px;
}

.container {
  max-width: 900px;
  margin: auto;
}

h1 {
  font-size: 20px;
}

.card {
  background: #161b22;
  border: 1px solid #2f353d;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 24px;
}

label {
  font-size: 13px;
  color: #9da7b3;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  background: #0d1117;
  border: 1px solid #2f353d;
  color: #fff;
  border-radius: 8px;
  font-size: 16px;
}

.buttons {
  margin-top: 10px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

button {
  background: #0d1117;
  border: 1px solid #2f353d;
  color: #fff;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  border-color: #2f81f7;
  color: #2f81f7;
}

h2 {
  font-size: 16px;
  color: #9da7b3;
  margin-bottom: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: #161b22;
  border-radius: 12px;
  overflow: hidden;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #2f353d;
  text-align: right;
}

th:first-child, td:first-child {
  text-align: left;
}

th {
  color: #9da7b3;
  font-size: 13px;
}
</style>
</head>

<body>
<div class="container">

<h1>Trading Risk Capital Calculator</h1>

<div class="card">
  <label>Risk Amount (₹)</label>
  <input id="risk" type="number" value="1000">

  <div class="buttons">
    <button onclick="setRisk(500)">500</button>
    <button onclick="setRisk(750)">750</button>
    <button onclick="setRisk(1000)">1000</button>
    <button onclick="setRisk(1250)">1250</button>
    <button onclick="setRisk(1500)">1500</button>
  </div>

  <br>

  <label>Stock Price (₹)</label>
  <input id="price" type="number" value="100">
</div>

<h2>Results</h2>

<table>
<thead>
<tr>
  <th>SL %</th>
  <th>Capital (₹)</th>
  <th>Quantity</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

</div>

<script>
const sls = [3, 3.25, 3.5, 3.75, 4, 4.25, 4.5, 4.75, 5];

function format(n) {
  return Math.ceil(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function setRisk(v) {
  document.getElementById("risk").value = v;
  calculate();
}

function calculate() {
  const risk = Number(document.getElementById("risk").value);
  const price = Number(document.getElementById("price").value);
  const tbody = document.getElementById("rows");

  tbody.innerHTML = "";

  if (risk <= 0 || price <= 0) return;

  sls.forEach(sl => {
    const capital = Math.ceil(risk / (sl / 100));
    const qty = Math.ceil(capital / price);

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${sl}%</td>
      <td>₹ ${format(capital)}</td>
      <td>${qty}</td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById("risk").addEventListener("input", calculate);
document.getElementById("price").addEventListener("input", calculate);

calculate();
</script>

</body>
</html>
